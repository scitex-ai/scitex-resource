name: CLA Assistant

# Thin caller. The body lives ONCE, org-side, in scitex-ai/.github@main.
# Converted from a local fork per PS-231 (audit-all green run). This is a
# SECURITY fix, not just hygiene: the fork ran on the SELF-HOSTED pool
# (`vars.CI_RUNS_ON` → scitex-ci) under outsider-triggerable events
# (`issue_comment` / `pull_request_target`), i.e. the exact end-state PS-224
# must never recommend. The reusable defaults to GitHub-hosted for this job.
# Side benefit: the fork hardcoded the CLA doc URL to the pre-org
# `ywatanabe1989/scitex-resource` path; the reusable derives the URL from
# `github.repository`.
#
# REQUIRED-CONTEXT CHECK (PS-231 blocker 1), verified before converting:
# `gh api repos/scitex-ai/scitex-resource/branches/{develop,main}/protection`
# requires ONLY `pytest-matrix / pytest-matrix-on-ubuntu-py3.{11,12,13}`.
# This workflow publishes no required context, so the job rename
# (`CLAssistant` -> `call`) cannot wedge branch protection on either branch.
#
# RUNNER PLACEMENT IS A SECURITY DECISION HERE, not bookkeeping (PS-224):
# outsider-triggerable + third-party code MUST stay on an ephemeral hosted
# runner — the persistent pool's $HOME holds the live fleet credential.
# `runs_on` is passed explicitly below rather than inherited from the callee
# default, because a security-relevant destination must be a decision with an
# author. Recorded as a job-scoped exemption in `.scitex/dev/config.yaml`
# (path `.github/workflows/cla.yml::call`).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989"
      # JSON array STRING — consumed by fromJSON in the callee. A YAML list
      # decodes to something fromJSON rejects and the job queues forever.
      runs_on: '["ubuntu-latest"]'
    secrets: inherit
